<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Pedidos da Pizzaria</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0} button,input,textarea,select{font:inherit}
    .wrap{max-width:760px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #00000010}
    h1{font-size:24px;margin:4px 0 6px}.muted{color:#6b7280;font-size:14px}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:17px}
    textarea{min-height:125px;resize:vertical}
    button{border:0;border-radius:12px;padding:13px 16px;min-height:48px;font-weight:700;cursor:pointer}
    .primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}
    .success{background:#166534;color:white}.danger{background:#fee2e2;color:#991b1b}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{width:100%}
    .order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}
    .orderhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .number{font-size:20px;font-weight:800}.status{font-size:12px;border-radius:999px;padding:5px 9px;background:#fef3c7}
    .done .status{background:#dcfce7;color:#166534}.ordertext{font-size:18px;line-height:1.45;margin:10px 0}
    .listen{font-size:19px;width:100%;background:#111827;color:white;margin:4px 0 8px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab.active,.tipo.active{outline:3px solid #9ca3af}.tipo{font-size:16px}
    .hidden{display:none!important}.msg{padding:10px 0;min-height:22px}
    .empty{text-align:center;padding:30px;color:#6b7280}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .pill{background:#e5e7eb;border-radius:999px;padding:6px 10px;font-size:12px}
    .small{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}
    .edit-panel{background:#f9fafb;border:1px solid #d1d5db;border-radius:12px;padding:12px;margin-top:10px}
    .order-age{display:inline-block;margin:2px 0 10px;padding:7px 10px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:14px;font-weight:700}
    .builder select,.builder textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:white;margin-bottom:8px}.builder textarea{min-height:75px}.edit-panel textarea{min-height:90px;font-size:16px;margin-bottom:8px}
    .edit-panel select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-bottom:8px}.row button{flex:1}
    @media(max-width:480px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.row button{flex-basis:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🍕 Pedidos da Pizzaria</h1>
    <div class="muted">Sistema para Caixa e Pizzaiolo</div>
  </div>

  <div id="setup" class="card">
    <h2>Entrar na pizzaria</h2>
    <label for="room">Código da pizzaria</label>
    <input id="room" autocomplete="off" placeholder="Ex.: pizzaria123">
    <p class="muted">O caixa e o pizzaiolo devem usar o mesmo código.</p>
    <button id="enter" class="primary wide">Entrar</button>
    <div id="setupMsg" class="msg" aria-live="polite"></div>
  </div>

  <main id="app" class="hidden">
    <div class="card">
      <div class="topline">
        <div><strong id="roomLabel"></strong><div id="connection" class="muted">Conectando...</div></div>
        <button id="leave" class="secondary">Sair</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tabCaixa" class="secondary tab active">🧾 Caixa</button>
      <button id="tabPizza" class="secondary tab">👨‍🍳 Pizzaiolo</button>
    </div>

    <section id="caixa">
      <div class="card">
        <h2>Novo pedido</h2>
        <div class="builder">
          <label for="quantityFlavors">Quantidade de sabores</label>
          <select id="quantityFlavors"><option value="1">1 sabor</option><option value="2">2 sabores</option></select>
          <label for="category1">Categoria do sabor 1</label>
          <select id="category1"></select>
          <label for="flavor1">Sabor 1</label>
          <select id="flavor1"></select>
          <div id="secondFlavorFields" class="hidden">
            <label for="category2">Categoria do sabor 2</label>
            <select id="category2"></select>
            <label for="flavor2">Sabor 2</label>
            <select id="flavor2"></select>
          </div>
          <label for="crustChoice">Borda recheada?</label>
          <select id="crustChoice"><option value="nao">Não</option><option value="sim">Sim</option></select>
          <div id="crustFields" class="hidden">
            <label for="crustFlavor">Recheio da borda</label>
            <select id="crustFlavor"><option>Catupiry</option><option>Cheddar</option><option>Mussarela</option><option>Chocolate</option></select>
          </div>
          <label for="observation">Observação</label>
          <textarea id="observation" placeholder="Ex.: sem cebola, bem passada..."></textarea>
          <textarea id="pedido" class="hidden" aria-hidden="true"></textarea>
        </div>
        <label>Tipo do pedido</label>
        <div class="grid" style="margin-top:6px">
          <button type="button" id="tipoMesa" class="secondary tipo active">🪑 MESA</button>
          <button type="button" id="tipoViagem" class="secondary tipo">🏍️ VIAGEM</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="send" class="primary">📤 Enviar pedido</button>
          <button id="clear" class="secondary">Limpar</button>
        </div>
        <div id="sendMsg" class="msg muted" aria-live="polite"></div>
        <div class="small muted"><b>Regra de áudio:</b> “/” será falado como “meia”.</div>
      </div>
      <div class="card">
        <div class="topline"><h2>Pedidos</h2><span id="caixaCount" class="pill">0</span></div>
        <div id="caixaList"></div>
      </div>
    </section>

    <section id="pizza" class="hidden">
      <div class="card">
        <div class="topline">
          <div><h2>Pedidos para preparar</h2><div class="muted">Toque em “Ouvir pedido”.</div></div>
          <span id="pizzaCount" class="pill">0 novos</span>
        </div>
      </div>
      <div id="pizzaList"></div>
      <div class="card">
        <div class="topline">
          <h2>Histórico</h2>
          <div class="row">
            <button id="downloadHistory" class="primary">📊 Baixar histórico Excel</button>
            <button id="clearHistory" class="danger" disabled>🗑️ Limpar histórico</button>
          </div>
        </div>
        <div id="history"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, push, onValue, update, remove, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/*
  ============================================================
  COLE A CONFIGURAÇÃO DO SEU FIREBASE AQUI
  Firebase Console > Configurações do projeto > Seus apps > Web
  ============================================================
*/
const firebaseConfig = {
  apiKey: "AIzaSyApKrNd7pfvk45USZ2WHeiHVeDHsgWe2Os",
  authDomain: "pizzaria-9db7a.firebaseapp.com",
  databaseURL: "https://pizzaria-9db7a-default-rtdb.firebaseio.com",
  projectId: "pizzaria-9db7a",
  storageBucket: "pizzaria-9db7a.firebasestorage.app",
  messagingSenderId: "257796688494",
  appId: "1:257796688494:web:7ac8161c21963aedfbf47f",
  measurementId: "G-JX076MZBNB"
};

const els = id => document.getElementById(id);
const setup = els("setup"), appEl = els("app"), setupMsg = els("setupMsg");
let app, auth, db, currentRoom = "", unsubscribe = null, selectedType = "mesa", currentTab = "caixa";
let previousOrderIds = new Set();
let firstOrdersSnapshot = true;
let notificationPermissionAsked = false;
let exportedHistoryFingerprint = "";

function firebaseReady(){
  return Object.values(firebaseConfig).every(v => v && !v.includes("COLE_AQUI"));
}
if(!firebaseReady()){
  setupMsg.innerHTML = "⚠️ Primeiro configure o Firebase seguindo o guia deste projeto.";
  els("enter").disabled = true;
} else {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
}

async function requestNotifications(){
  if(notificationPermissionAsked) return;
  notificationPermissionAsked = true;
  if("Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch(e) {}
  }
}

function playNewOrderAlert(){
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.45);
    osc.onended = () => ctx.close();
  } catch(e) {}
}

function announceNewOrder(){
  playNewOrderAlert();
  if("Notification" in window && Notification.permission === "granted") {
    try { new Notification("Novo pedido", { body: "Chegou um novo pedido para preparar." }); } catch(e) {}
  }
  if("speechSynthesis" in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Novo pedido");
      u.lang = "pt-BR"; u.rate = 0.95; u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }
}

function normalizeForSpeech(text){
  return text.trim()
    .replace(/\//g, " meia ")
    .replace(/\s+/g, " ")
    .replace(/\bcatupiry\b/gi, "catupiry")
    .replace(/([0-9]+)\s*x\s*([0-9]+)/gi, "$1 por $2")
    .replace(/[;]+/g, ". ");
}

function speakOrder(order){
  if(!("speechSynthesis" in window)){
    alert("Este celular não possui leitura de voz compatível.");
    return;
  }
  window.speechSynthesis.cancel();
  const tipo = order.type === "viagem" ? "viagem." : "mesa.";
  const text = `Pedido número ${order.number}. ${tipo} ${normalizeForSpeech(order.text)}`;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR";
  u.rate = 0.88;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function nextOrderNumber(room){
  const counterRef = ref(db, `pizzarias/${room}/counter`);
  const result = await runTransaction(counterRef, current => (Number(current)||0)+1);
  return result.snapshot.val();
}

async function enterRoom(){
  const room = els("room").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
  if(!room){ setupMsg.textContent = "Digite um código para a pizzaria."; return; }
  if(!firebaseReady()){ return; }
  setupMsg.textContent = "Conectando...";
  try{
    await signInAnonymously(auth);
    currentRoom = room;
    els("roomLabel").textContent = "Pizzaria: " + room;
    setup.classList.add("hidden"); appEl.classList.remove("hidden");
    subscribe();
  }catch(e){
    console.error(e);
    setupMsg.textContent = "Não foi possível conectar. Confira a configuração do Firebase e a autenticação anônima.";
  }
}

function subscribe(){
  if(unsubscribe) unsubscribe();
  const ordersRef = ref(db, `pizzarias/${currentRoom}/orders`);
  unsubscribe = onValue(ordersRef, snap => {
    const data = snap.val() || {};
    const orders = Object.entries(data).map(([id,o]) => ({id,...o})).sort((a,b)=>(a.number||0)-(b.number||0));
    const currentIds = new Set(orders.filter(o => o.status === "novo").map(o => o.id));
    const newOrders = orders.filter(o => o.status === "novo" && !previousOrderIds.has(o.id));
    if(!firstOrdersSnapshot && currentTab === "pizza" && newOrders.length) {
      announceNewOrder();
    }
    previousOrderIds = currentIds;
    firstOrdersSnapshot = false;
    render(orders);
    els("connection").textContent = "🟢 Conectado em tempo real";
  }, err => {
    console.error(err);
    els("connection").textContent = "🔴 Erro de conexão";
  });
}

function updateOrderAges(){
  document.querySelectorAll("[data-order-age]").forEach(el=>{
    const sentAt = Number(el.dataset.orderAge);
    if(!sentAt){ el.textContent = "⏱️ Tempo de envio indisponível"; return; }
    const minutes = Math.max(0, Math.floor((Date.now() - sentAt) / 60000));
    el.textContent = `⏱️ Enviado há ${minutes} ${minutes === 1 ? "minuto" : "minutos"}`;
  });
}


const flavorMenu = {
  "Presunto": ["Americana","Bauru","Brasileira","Portuguesa","Itália","A Moda Pizzaiolo"],
  "Lombo": ["Lombo à Moda","Montreal","Canadá","Alaska","Madagascar","Romanesca"],
  "Queijo": ["Flamenguinho","Marguerita","Mucarela","Napolitana","Pepperone","Dois Queijos","Quatro Queijo","Pizza do Vaqueiro"],
  "Calabresa": ["Baiana","Calabresa","A Moda da Casa","Calamussa","Toscana","Mexicana","Casteliana"],
  "Do Mar": ["Atum","Peru","Uruguai","Venezuela","Argentina","Genova","Brasil","Nordestina"],
  "Frango": ["Caipira","Carijó 1","Carijó 2","Cocoricó","Turim","Roma"],
  "Doces": ["Prestígio","Brigadeiro","M&M's"]
};
function fillCategorySelect(id){
  const el=els(id); if(!el) return;
  el.innerHTML=Object.keys(flavorMenu).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  fillFlavorSelect(id==="category1"?"flavor1":"flavor2",el.value);
}
function fillFlavorSelect(id,category){
  const el=els(id); if(!el) return;
  el.innerHTML=(flavorMenu[category]||[]).map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("");
}
function updateBuilderVisibility(){
  const two=els("quantityFlavors").value==="2";
  els("secondFlavorFields").classList.toggle("hidden",!two);
  const hasCrust=els("crustChoice").value==="sim";
  els("crustFields").classList.toggle("hidden",!hasCrust);
}
function buildOrderData(){
  const flavors=[els("flavor1").value];
  if(els("quantityFlavors").value==="2") flavors.push(els("flavor2").value);
  const crust=els("crustChoice").value==="sim"?els("crustFlavor").value:"";
  const observation=els("observation").value.trim();
  const text=flavors.join(" / ")+(crust?` | Borda recheada: ${crust}`:"")+(observation?` | Observação: ${observation}`:"");
  return {text,flavors,crust,observation};
}
function resetBuilder(){
  els("quantityFlavors").value="1";
  els("category1").value=Object.keys(flavorMenu)[0]; fillFlavorSelect("flavor1",els("category1").value);
  els("category2").value=Object.keys(flavorMenu)[0]; fillFlavorSelect("flavor2",els("category2").value);
  els("crustChoice").value="nao"; els("observation").value="";
  updateBuilderVisibility();
}
function historyFingerprint(done){
  return done.map(o=>`${o.id}:${o.number}:${o.createdAt||0}:${o.text||""}:${o.type||""}:${o.crust||""}:${o.observation||""}`).sort().join("|");
}
function updateHistoryControls(orders){
  const done=orders.filter(o=>o.status==="done");
  const active=orders.filter(o=>o.status==="novo");
  const fp=historyFingerprint(done);
  const canClear=done.length>0 && active.length===0 && exportedHistoryFingerprint===fp;
  els("clearHistory").disabled=!canClear;
  els("clearHistory").title=canClear?"Histórico exportado. Pode limpar.":"Baixe o histórico atual e conclua os pedidos pendentes antes de limpar.";
}
function downloadHistoryExcel(){
  const orders=window.__orders||[];
  const done=orders.filter(o=>o.status==="done").sort((a,b)=>(a.number||0)-(b.number||0));
  if(!done.length){alert("Não há pedidos concluídos para baixar.");return;}
  if(!window.XLSX){alert("Não foi possível carregar o gerador Excel. Verifique a conexão e tente novamente.");return;}
  const rows=done.map(o=>{
    const date=o.createdAt?new Date(Number(o.createdAt)) : null;
    return {
      "Número do pedido":o.number??"",
      "Data":date&&!isNaN(date)?date.toLocaleDateString("pt-BR"):"",
      "Hora":date&&!isNaN(date)?date.toLocaleTimeString("pt-BR"):"",
      "Sabor(es) da pizza":Array.isArray(o.flavors)?o.flavors.join(" / "):(o.text||"").split(" | Borda recheada:")[0].split(" | Observação:")[0],
      "Borda recheada":o.crust||"Não",
      "Mesa ou Entrega":o.type==="viagem"?"Entrega":"Mesa",
      "Observação":o.observation||""
    };
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Pedidos concluídos");
  const month=new Date().toISOString().slice(0,7);
  XLSX.writeFile(wb,`historico_pizzaria_${month}.xlsx`);
  exportedHistoryFingerprint=historyFingerprint(done);
  updateHistoryControls(orders);
  alert("Relatório Excel gerado. Agora você pode limpar o histórico, desde que não existam pedidos aguardando preparo.");
}
function render(orders){
  const active = orders.filter(o=>o.status==="novo");
  els("caixaCount").textContent = orders.length + " total";
  els("pizzaCount").textContent = active.length + " novos";

  els("caixaList").innerHTML = orders.length ? orders.map(o=>`
    <div class="order ${o.status==="done"?"done":""}">
      <div class="orderhead"><span class="number">#${o.number}</span><span class="status">${o.status==="novo"?"Aguardando":"Concluído"}</span></div>
      <div class="ordertext">${esc(o.text)}</div>
      <div class="small">${o.type==="viagem"?"🏍️ VIAGEM":"🪑 MESA"}</div>
      ${o.status==="novo" ? `
        <button class="secondary wide" data-edit="${o.id}" style="margin-top:10px">✏️ Editar pedido</button>
        <div class="edit-panel hidden" id="edit-panel-${o.id}">
          <label for="edit-text-${o.id}">Editar pedido #${o.number}</label>
          <textarea id="edit-text-${o.id}">${esc(o.text)}</textarea>
          <label for="edit-type-${o.id}">Tipo do pedido</label>
          <select id="edit-type-${o.id}">
            <option value="mesa" ${o.type==="mesa"?"selected":""}>🪑 MESA</option>
            <option value="viagem" ${o.type==="viagem"?"selected":""}>🏍️ VIAGEM</option>
          </select>
          <div class="row">
            <button class="success" data-save-edit="${o.id}">💾 Salvar alterações</button>
            <button class="secondary" data-cancel-edit="${o.id}">Cancelar</button>
          </div>
        </div>` : '<div class="small muted" style="margin-top:8px">🔒 Pedido concluído — edição bloqueada.</div>'}
    </div>`).join("") : '<div class="empty">Nenhum pedido ainda.</div>';

  els("pizzaList").innerHTML = active.length ? active.map(o=>`
    <div class="card order">
      <div class="orderhead"><span class="number">Pedido #${o.number} ${o.type==="viagem"?"🏍️":"🪑"}</span><span class="status">${o.type==="viagem"?"VIAGEM":"MESA"} • NOVO</span></div>
      <div class="ordertext">${esc(o.text)}</div>
      <div class="order-age" data-order-age="${Number(o.createdAt)||0}">⏱️ Calculando tempo...</div>
      <button class="listen" data-speak="${o.id}">▶️ OUVIR PEDIDO</button>
      <div class="row">
        <button class="secondary" data-speak="${o.id}">🔁 Ouvir novamente</button>
        <button class="success" data-done="${o.id}">✅ Pedido concluído</button>
      </div>
    </div>`).join("") : '<div class="card empty">🎉 Nenhum pedido aguardando preparo.</div>';
  updateOrderAges();

  const done = orders.filter(o=>o.status==="done");
  els("history").innerHTML = done.length ? done.map(o=>`
    <div class="order done">
      <div class="orderhead"><b class="number">#${o.number}</b><span class="small">${o.type==="viagem"?"🏍️ VIAGEM":"🪑 MESA"}</span></div>
      <div class="ordertext">${esc(o.text)}</div>
    </div>`).join("") :
    '<div class="empty">Nenhum pedido concluído.</div>';
  updateHistoryControls(orders);
}

els("enter").addEventListener("click", enterRoom);
els("room").addEventListener("keydown", e=>{if(e.key==="Enter") enterRoom();});

els("tipoMesa").addEventListener("click",()=>{selectedType="mesa";els("tipoMesa").classList.add("active");els("tipoViagem").classList.remove("active");});
els("tipoViagem").addEventListener("click",()=>{selectedType="viagem";els("tipoViagem").classList.add("active");els("tipoMesa").classList.remove("active");});

els("send").addEventListener("click", async ()=>{
  const orderData = buildOrderData();
  const text = orderData.text;
  if(!orderData.flavors.length || !orderData.flavors[0]){els("sendMsg").textContent="Selecione o sabor da pizza."; return;}
  try{
    els("send").disabled=true;
    const number = await nextOrderNumber(currentRoom);
    const ordersRef = ref(db, `pizzarias/${currentRoom}/orders`);
    await push(ordersRef,{number,text,flavors:orderData.flavors,crust:orderData.crust,observation:orderData.observation,type:selectedType,status:"novo",createdAt:Date.now()});
    resetBuilder();
    els("sendMsg").textContent=`Pedido #${number} enviado para a cozinha.`;
  }catch(e){
    console.error(e); els("sendMsg").textContent="Erro ao enviar o pedido.";
  }finally{els("send").disabled=false;}
});

els("clear").addEventListener("click",()=>{resetBuilder();els("sendMsg").textContent="";});

Object.keys(flavorMenu).length && fillCategorySelect("category1");
fillCategorySelect("category2");
els("category1").addEventListener("change",()=>fillFlavorSelect("flavor1",els("category1").value));

els("clearHistory").addEventListener("click", async ()=>{
  const doneNow=(window.__orders||[]).filter(o=>o.status==="done");
  if(exportedHistoryFingerprint!==historyFingerprint(doneNow)){
    alert("Antes de excluir, baixe novamente o histórico atual em Excel.");
    updateHistoryControls(window.__orders||[]);
    return;
  }
  if(!currentRoom) return;
  const all = window.__orders || [];
  const done = all.filter(o => o.status === "done");
  const active = all.filter(o => o.status === "novo");
  if(!done.length){ alert("Não há pedidos concluídos no histórico."); return; }
  if(active.length){
    alert("Para limpar o histórico e zerar a numeração, primeiro conclua os pedidos que ainda estão aguardando preparo.");
    return;
  }
  const ok = confirm(`Apagar ${done.length} pedido(s) do histórico e zerar a numeração? Esta ação não pode ser desfeita.`);
  if(!ok) return;
  try {
    await Promise.all(done.map(o => remove(ref(db, `pizzarias/${currentRoom}/orders/${o.id}`))));
    await update(ref(db, `pizzarias/${currentRoom}`), { counter: 0 });
    exportedHistoryFingerprint="";
  } catch(err) {
    console.error(err);
    alert("Não foi possível limpar o histórico e zerar a numeração.");
  }
});

document.addEventListener("click", async e=>{
  const editBtn = e.target.closest("[data-edit]");
  if(editBtn){
    const panel = els(`edit-panel-${editBtn.dataset.edit}`);
    if(panel) panel.classList.toggle("hidden");
    return;
  }
  const cancelEditBtn = e.target.closest("[data-cancel-edit]");
  if(cancelEditBtn){
    const panel = els(`edit-panel-${cancelEditBtn.dataset.cancelEdit}`);
    if(panel) panel.classList.add("hidden");
    return;
  }
  const saveEditBtn = e.target.closest("[data-save-edit]");
  if(saveEditBtn){
    const id = saveEditBtn.dataset.saveEdit;
    const order = (window.__orders || []).find(o => o.id === id);
    if(!order || order.status !== "novo"){
      alert("Este pedido já foi concluído e não pode mais ser editado.");
      return;
    }
    const text = els(`edit-text-${id}`)?.value.trim();
    const type = els(`edit-type-${id}`)?.value;
    if(!text){ alert("Digite o pedido antes de salvar."); return; }
    if(!["mesa","viagem"].includes(type)){ alert("Selecione um tipo de pedido válido."); return; }
    saveEditBtn.disabled = true;
    try{
      await update(ref(db, `pizzarias/${currentRoom}/orders/${id}`), {
        text, type, flavors: null, crust: "", observation: "", editedAt: serverTimestamp()
      });
    }catch(err){
      console.error(err);
      alert("Não foi possível salvar as alterações. Tente novamente.");
      saveEditBtn.disabled = false;
    }
    return;
  }
  const speakBtn=e.target.closest("[data-speak]");
  if(speakBtn){
    const id=speakBtn.dataset.speak;
    const snapData = window.__orders || [];
    const order=snapData.find(o=>o.id===id);
    if(order) speakOrder(order);
  }
  const done=e.target.closest("[data-done]");
  if(done){
    const id = done.dataset.done;
    const orders = (window.__orders || []).filter(o => o.status === "novo").sort((a,b)=>(a.number||0)-(b.number||0));
    const currentIndex = orders.findIndex(o => o.id === id);
    const nextOrder = currentIndex >= 0 ? orders[currentIndex + 1] : orders[0];
    try{
      await update(ref(db,`pizzarias/${currentRoom}/orders/${id}`),{status:"done"});
      if(nextOrder){
        setTimeout(() => speakOrder(nextOrder), 250);
      }
    }
    catch(err){alert("Não foi possível concluir o pedido.");}
  }
});

function tab(name){
  currentTab = name;
  if(name === "pizza") requestNotifications();
  const caixa=name==="caixa";
  els("caixa").classList.toggle("hidden",!caixa);
  els("pizza").classList.toggle("hidden",caixa);
  els("tabCaixa").classList.toggle("active",caixa);
  els("tabPizza").classList.toggle("active",!caixa);
}
els("tabCaixa").addEventListener("click",()=>tab("caixa"));
els("tabPizza").addEventListener("click",()=>tab("pizza"));
els("leave").addEventListener("click",()=>{
  if(unsubscribe)unsubscribe();
  currentRoom=""; previousOrderIds = new Set(); firstOrdersSnapshot = true; currentTab = "caixa";
  appEl.classList.add("hidden"); setup.classList.remove("hidden");
});

// Atualiza o tempo de espera dos pedidos a cada 30 segundos, sem recarregar a tela.
setInterval(updateOrderAges, 30000);

const originalRender = render;
render = function(orders){ window.__orders=orders; originalRender(orders); };
